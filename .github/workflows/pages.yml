name: Publicar edital no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "edital/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar os arquivos do edital
        uses: actions/upload-pages-artifact@v3
        with:
          path: edital
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
