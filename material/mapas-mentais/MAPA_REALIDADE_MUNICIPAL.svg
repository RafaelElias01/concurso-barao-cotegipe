<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#ffffff; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Título -->
  <text x="500" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c2330">MAPA MENTAL: REALIDADE MUNICIPAL – BARÃO DE COTEGIPE (RS)</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#5b6577">Concurso Público – Edital 001/2026 – Banca Instituto DOM | Foco Visual e Dados Exatos do IBGE</text>

  <!-- Linhas conectoras -->
  <!-- Centro para Ramo 1 (História - Superior Esquerdo) -->
  <path d="M 430 290 Q 280 200 240 130" stroke="#1f5fbf" stroke-width="3" fill="none"/>
  <!-- Centro para Ramo 2 (Geografia/Bioma - Inferior Esquerdo) -->
  <path d="M 430 330 Q 280 400 230 480" stroke="#0f7a6b" stroke-width="3" fill="none"/>
  <!-- Centro para Ramo 3 (Demografia IBGE 2022 - Superior Direito) -->
  <path d="M 570 290 Q 720 200 760 130" stroke="#7a3fc4" stroke-width="3" fill="none"/>
  <!-- Centro para Ramo 4 (Economia/Poderes - Inferior Direito) -->
  <path d="M 570 330 Q 720 400 770 480" stroke="#b25e00" stroke-width="3" fill="none"/>

  <!-- NÓ CENTRAL -->
  <rect x="420" y="270" width="160" height="80" rx="15" fill="#1b5eb8" filter="url(#shadow)"/>
  <text x="500" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">BARÃO DE</text>
  <text x="500" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">COTEGIPE (RS)</text>
  <text x="500" y="342" text-anchor="middle" font-size="10" fill="#e0ecfc">Alto Uruguai (RS)</text>

  <!-- ==================== RAMO 1: FORMAÇÃO HISTÓRICA (Azul) ==================== -->
  <rect x="60" y="80" width="280" height="150" rx="10" fill="#f0f5fc" stroke="#1f5fbf" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="80" width="280" height="28" rx="8" fill="#1f5fbf"/>
  <text x="200" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1. FORMAÇÃO HISTÓRICA</text>
  
  <text x="75" y="125" font-size="11" fill="#1c2330">• <tspan font-weight="bold">Início do Povoamento:</tspan> c. 1911</text>
  <text x="75" y="143" font-size="11" fill="#1c2330">• <tspan font-weight="bold">Primeiro Nome:</tspan> <tspan fill="#b02a6b" font-weight="bold">Floresta</tspan> (distrito 1939)</text>
  <text x="75" y="161" font-size="11" fill="#1c2330">• <tspan font-weight="bold">Imigrantes:</tspan> Italianos, Poloneses, Ucranianos...</text>
  <text x="75" y="179" font-size="11" fill="#1c2330">• <tspan font-weight="bold">Nome atual:</tspan> desde 1944</text>
  <text x="75" y="197" font-size="11" fill="#7a3fc4">• <tspan font-weight="bold">LEI 4.737:</tspan> <tspan font-weight="bold">01/06/1964</tspan> (de 3 municípios)</text>
  <text x="75" y="215" font-size="11" fill="#7a3fc4">• <tspan font-weight="bold">INSTALAÇÃO:</tspan> <tspan font-weight="bold">23 de janeiro de 1965</tspan></text>

  <!-- ==================== RAMO 2: GEOGRAFIA E MEIO AMBIENTE (Verde) ==================== -->
  <rect x="60" y="420" width="280" height="160" rx="10" fill="#f0faf7" stroke="#0f7a6b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="420" width="280" height="28" rx="8" fill="#0f7a6b"/>
  <text x="200" y="439" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2. GEOGRAFIA E TERRITÓRIO</text>

  <text x="75" y="465" font-size="11" fill="#1c2330">• <tspan font-weight="bold">Localização:</tspan> Norte do RS, Alto Uruguai</text>
  <text x="75" y="483" font-size="11" fill="#7a3fc4">• <tspan font-weight="bold">Área Territorial Oficial:</tspan> <tspan font-weight="bold">260,5 km²</tspan></text>
  <text x="75" y="501" font-size="11" fill="#0f7a6b">• <tspan font-weight="bold">Vegetação (IBGE):</tspan> mata nativa e pastagens</text>
  <text x="75" y="519" font-size="11" fill="#1c2330">• <tspan font-weight="bold">Vizinhos:</tspan> Erechim, S. Valentim, Itatiba Sul,</text>
  <text x="85" y="534" font-size="10" fill="#5b6577">B. Rio Azul, Ponte Preta, Paulo Bento</text>
  <text x="75" y="555" font-size="11" fill="#b3261e" font-weight="bold">⚠️ Pegadinha: lei = 1964 | instalação = 1965</text>
  <text x="75" y="570" font-size="10" fill="#5b6577">Altitude 765 m | 370 km de Porto Alegre</text>

  <!-- ==================== RAMO 3: DADOS IBGE CENSO 2022 (Roxo) ==================== -->
  <rect x="660" y="80" width="280" height="150" rx="10" fill="#f8f4fd" stroke="#7a3fc4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="80" width="280" height="28" rx="8" fill="#7a3fc4"/>
  <text x="800" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3. DADOS OFICIAIS DO IBGE</text>

  <text x="675" y="125" font-size="11" fill="#7a3fc4">• <tspan font-weight="bold">População (Censo 2022):</tspan> <tspan font-weight="bold">7.144 habitantes</tspan></text>
  <text x="675" y="143" font-size="11" fill="#7a3fc4">• <tspan font-weight="bold">Densidade Demográfica:</tspan> <tspan font-weight="bold">27,42 hab/km²</tspan></text>
  <text x="675" y="161" font-size="11" fill="#1c2330">• <tspan font-weight="bold">Gentílico Oficial:</tspan> <tspan font-weight="bold" fill="#1b5eb8">cotegipense</tspan></text>
  <text x="675" y="179" font-size="11" fill="#7a3fc4">• <tspan font-weight="bold">Fonte:</tspan> IBGE Censo 2022</text>
  <text x="675" y="197" font-size="11" fill="#1d7a46">• <tspan font-weight="bold">Área:</tspan> <tspan font-weight="bold">260,5 km²</tspan></text>
  <text x="675" y="215" font-size="11" fill="#1c2330">• <tspan font-weight="bold">Nome:</tspan> Cotegipe 1939 → Barão 1944</text>

  <!-- ==================== RAMO 4: ECONOMIA E PODERES (Laranja) ==================== -->
  <rect x="660" y="420" width="280" height="160" rx="10" fill="#fffaf2" stroke="#b25e00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="420" width="280" height="28" rx="8" fill="#b25e00"/>
  <text x="800" y="439" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4. ECONOMIA E PODERES LOCAIS</text>

  <text x="675" y="465" font-size="11" fill="#b25e00">• <tspan font-weight="bold">Base Econômica:</tspan> Setor primário (IBGE)</text>
  <text x="685" y="480" font-size="10" fill="#5b6577">Milho, trigo, soja, feijão, erva-mate, leite</text>
  <text x="675" y="500" font-size="11" fill="#1c2330">• <tspan font-weight="bold">Poder Legislativo:</tspan> Câmara de Vereadores</text>
  <text x="685" y="515" font-size="10" fill="#5b6577">(teto 9 até 15 mil hab. - CF art. 29)</text>
  <text x="675" y="535" font-size="11" fill="#1c2330">• <tspan font-weight="bold">Poder Executivo:</tspan> Prefeito e Vice-Prefeito</text>
  <text x="675" y="555" font-size="11" fill="#b3261e" font-weight="bold">⚠️ Pegadinha: NÃO HÁ Poder Judiciário Municipal!</text>
  <text x="685" y="570" font-size="10" fill="#5b6577">(só federal e estadual)</text>

  <!-- Legenda do Código de Cores do Aluno -->
  <rect x="150" y="605" width="700" height="35" rx="6" fill="#f8f9fa" stroke="#dde1e8"/>
  <text x="160" y="627" font-size="11" font-weight="bold" fill="#1c2330">CÓDIGO VISUAL:</text>
  <rect x="270" y="617" width="12" height="12" rx="2" fill="#1f5fbf"/>
  <text x="288" y="627" font-size="11" fill="#5b6577">Conceito</text>
  <rect x="360" y="617" width="12" height="12" rx="2" fill="#1d7a46"/>
  <text x="378" y="627" font-size="11" fill="#5b6577">Dica / Acerto</text>
  <rect x="470" y="617" width="12" height="12" rx="2" fill="#b25e00"/>
  <text x="488" y="627" font-size="11" fill="#5b6577">Cai Muito</text>
  <rect x="570" y="617" width="12" height="12" rx="2" fill="#b3261e"/>
  <text x="588" y="627" font-size="11" fill="#5b6577">Pegadinha</text>
  <rect x="680" y="617" width="12" height="12" rx="2" fill="#7a3fc4"/>
  <text x="698" y="627" font-size="11" fill="#5b6577">Prazos e Números</text>
</svg>